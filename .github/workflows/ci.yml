# Versions verified 2026-07-22:
#   actions/checkout v7.0.1 -> 3d3c42e5aac5ba805825da76410c181273ba90b1
#   jdx/mise-action  v4.2.1 -> dad1bfd3df957f44999b559dd69dc1671cb4e9ea
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: connect_it
          POSTGRES_PASSWORD: connect_it
          POSTGRES_DB: connect_it_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U connect_it -d connect_it_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      # NOTE: if the memohai/ui submodule is (or becomes) private, the default
      # GITHUB_TOKEN cannot fetch it; provide a deploy key via the `ssh-key`
      # input or a PAT via the `token` input of actions/checkout.
      - name: Check out repository (with ui submodule)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false

      - name: Install toolchain (go/node/pnpm) via mise
        uses: jdx/mise-action@dad1bfd3df957f44999b559dd69dc1671cb4e9ea # v4.2.1

      - name: Vet Go modules
        run: mise run vet

      - name: Test Go modules (unit + DB integration)
        run: mise run test
        env:
          TEST_DATABASE_URL: postgres://connect_it:connect_it@localhost:5432/connect_it_test?sslmode=disable

      - name: Race-test Provider runtime
        working-directory: packages/core
        run: go test -race ./...

      - name: Race-test Provider adapters (real smoke excluded)
        working-directory: packages/connectors
        run: go test -race -skip 'RealSmoke$' ./...

      - name: Test fail-closed Provider real-smoke gate
        run: mise run test-provider-real-smoke-gate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify generated artifacts and Go module graphs
        run: |
          mise run swagger
          mise run sdk
          mise run sqlc
          for module in packages/*/; do
            if [ -f "${module}/go.mod" ]; then
              (cd "${module}" && go mod tidy -diff)
            fi
          done
          git diff --check HEAD
          git diff --exit-code HEAD -- \
            packages/api/docs \
            packages/sdk/src \
            packages/service/store
          untracked_generated="$(
            git ls-files --others --exclude-standard -- \
              packages/api/docs \
              packages/sdk/src \
              packages/service/store
          )"
          if [ -n "${untracked_generated}" ]; then
            printf 'Untracked generated artifacts:\n%s\n' "${untracked_generated}"
            exit 1
          fi

      - name: Run web unit tests
        run: pnpm --dir packages/web run test

      - name: Build web UI
        run: mise run build-web

      - name: Validate immutable release Compose model
        run: mise run check-release-compose

      - name: Test Docker ingress runner isolation
        run: bash scripts/test-mcp-ingress-docker-unit.sh

      - name: Build production Docker images
        run: |
          docker build \
            --build-arg "CONNECT_IT_BUILD_REVISION=${GITHUB_SHA}" \
            -f docker/server.Dockerfile \
            -t connect-it-server:ci \
            .
          docker build \
            --build-arg "CONNECT_IT_BUILD_REVISION=${GITHUB_SHA}" \
            -f docker/web.Dockerfile \
            -t connect-it-web:ci \
            .

      - name: Real Docker/Nginx MCP ingress contract
        run: bash scripts/test-mcp-ingress-docker.sh
        env:
          CONNECT_IT_INGRESS_SERVER_IMAGE: connect-it-server:ci
          CONNECT_IT_INGRESS_WEB_IMAGE: connect-it-web:ci
          CONNECT_IT_INGRESS_SKIP_BUILD: "1"
