name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: connect_it
          POSTGRES_PASSWORD: connect_it
          POSTGRES_DB: connect_it_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U connect_it -d connect_it_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      # NOTE: if the memohai/ui submodule is (or becomes) private, the default
      # GITHUB_TOKEN cannot fetch it; provide a deploy key via the `ssh-key`
      # input or a PAT via the `token` input of actions/checkout.
      - name: Check out repository (with ui submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install toolchain (go/node/pnpm) via mise
        uses: jdx/mise-action@v4

      - name: Vet Go modules
        run: mise run vet

      - name: Test Go modules (unit + DB integration)
        run: mise run test
        env:
          TEST_DATABASE_URL: postgres://connect_it:connect_it@localhost:5432/connect_it_test?sslmode=disable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: pnpm --dir packages/web run test

      - name: Build web UI
        run: mise run build-web

      - name: Docker build smoke test (server + web images)
        run: |
          docker build -f docker/server.Dockerfile -t connect-it-server:ci .
          docker build -f docker/web.Dockerfile -t connect-it-web:ci .

  publish:
    name: Publish container images
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      # Serialize publishes per ref so repeated pushes queue up. The group must
      # include the ref: GitHub keeps only the newest pending run per group, so
      # a shared group would let a later main push silently cancel a queued tag
      # publish and the release images would never be pushed.
      group: publish-images-${{ github.ref }}
      cancel-in-progress: false
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
