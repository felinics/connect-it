name: CI

on:
  push:
    branches: [main]
    tags: ["v*.*.*"]
  pull_request:
  workflow_dispatch:

jobs:
  ci:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    permissions:
      contents: read
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: connect_it
          POSTGRES_PASSWORD: connect_it
          POSTGRES_DB: connect_it_test
        ports:
          - "5432:5432"
        options: >-
          --health-cmd "pg_isready -U connect_it -d connect_it_test"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 20
    steps:
      # NOTE: if the felinics/ui submodule is (or becomes) private, the default
      # GITHUB_TOKEN cannot fetch it; provide a deploy key via the `ssh-key`
      # input or a PAT via the `token` input of actions/checkout.
      - name: Check out repository (with ui submodule)
        uses: actions/checkout@v7
        with:
          submodules: recursive

      - name: Install toolchain (go/node/pnpm) via mise
        uses: jdx/mise-action@v4

      - name: Validate release version
        id: version
        env:
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version=$(node -p "require('./version.json').version")
          if [[ ! "$version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "version.json must contain stable semver, got: $version" >&2
            exit 1
          fi
          if [[ "$REF_TYPE" == "tag" && "$REF_NAME" != "v$version" ]]; then
            echo "tag $REF_NAME does not match version.json v$version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - name: Vet Go modules
        run: mise run vet

      - name: Test Go modules (unit + DB integration)
        run: mise run test
        env:
          TEST_DATABASE_URL: postgres://connect_it:connect_it@localhost:5432/connect_it_test?sslmode=disable

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Run web unit tests
        run: pnpm --dir packages/web run test

      - name: Test release helpers
        run: mise run test-release

      - name: Build web UI
        run: mise run build-web

      - name: Docker build smoke test
        run: docker build --build-arg VERSION=${{ steps.version.outputs.version }} -t connect-it:ci .

  publish:
    name: Publish container image
    needs: ci
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    concurrency:
      # Serialize publishes because main and stable tags can both move `latest`,
      # while release tags can share floating 1 / 1.2 tags.
      group: publish-images
      cancel-in-progress: false
      queue: max
    permissions:
      contents: read
      packages: write
    uses: ./.github/workflows/publish-images.yml
    with:
      version: ${{ needs.ci.outputs.version }}

  release:
    name: Create GitHub Release
    needs: [ci, publish]
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Create release with generated notes
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release $GITHUB_REF_NAME already exists"
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --generate-notes \
            --title "$GITHUB_REF_NAME"
