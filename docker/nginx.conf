# connect-it web 容器：静态托管管理界面（SPA 回退）＋反代 API 到 server 容器。
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA：非 API 路径全部回退 index.html。
    location / {
        try_files $uri /index.html;
    }

    # API 反代（服务名 connect-it 来自 docker-compose）。
    location ~ ^/(v1|admin|mcp|healthz|swagger)(/|$) {
        proxy_pass http://connect-it:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /mcp 走 SSE（Streamable HTTP），不能缓冲。
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
