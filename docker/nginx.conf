# Provider authorization/install proof, state and code travel in query
# parameters. Keep those routes out of the default Nginx access log; the
# application records only bounded, content-free authorization events.
map $uri $connect_it_access_loggable {
    default 1;
    ~^/v1/(oauth|install)/callback/?$ 0;
    ~^/(v1|admin)/connections/(oauth|install|[^/]+/reauth)/?$ 0;
}

# connect-it web 容器：静态托管管理界面（SPA 回退）＋反代 API 到 server 容器。
server {
    listen 8080;
    server_name _;

    access_log /var/log/nginx/access.log combined if=$connect_it_access_loggable;

    root /usr/share/nginx/html;
    index index.html;

    # SPA：非 API 路径全部回退 index.html。
    location / {
        try_files $uri /index.html;
    }

    # MCP request body 由 Go 在 SDK decode 前执行精确 36 MiB 限制。Nginx 的
    # 37 MiB 仅是更外层的粗 cap，且关闭 request buffering 以免把整个上传预存
    # 到代理临时文件。35s 比应用的 25s body deadline 和 30s server ReadTimeout
    # 都略宽，优先让 Go 返回稳定错误。
    location = /mcp {
        client_max_body_size 37m;
        client_body_timeout 35s;
        error_page 413 = @mcp_body_too_large;

        proxy_pass http://connect-it:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_request_buffering off;
        proxy_buffering off;
        proxy_send_timeout 35s;
        proxy_read_timeout 300s;
    }

    location @mcp_body_too_large {
        internal;
        default_type application/json;
        return 413 '{"error":"input_too_large","message":"MCP request body exceeds the 36 MiB limit"}';
    }

    # 其余 API 保持 Nginx 默认的 1 MiB body cap，不随 /mcp 放宽。
    # 服务名 connect-it 来自 docker-compose。
    location ~ ^/(v1|admin|healthz|swagger)(/|$) {
        proxy_pass http://connect-it:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
