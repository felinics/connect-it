# connect-it web container: serves the admin UI statically with an SPA fallback
# and reverse-proxies the API to the server container.
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # SPA: every non-API path falls back to index.html.
    location / {
        try_files $uri /index.html;
    }

    # API reverse proxy; the connect-it service name comes from compose.
    location ~ ^/(v1|admin|mcp|healthz|swagger)(/|$) {
        proxy_pass http://connect-it:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # /mcp uses SSE (Streamable HTTP) and must not be buffered.
        proxy_buffering off;
        proxy_read_timeout 300s;
    }
}
