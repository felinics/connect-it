[settings]
# When a system Go is installed, the go on PATH and the GOROOT mise injects can
# disagree (driver/toolchain version mismatch). Disable the injection so every
# go binary uses its own GOROOT.
go_set_goroot = false

[tools]
go = "1.25"
node = "22"
pnpm = "10"
sqlc = "1.29.0"

[tasks.test]
description = "Run tests for every Go module"
run = '''
set -e
for d in packages/*/ sdk/go/; do
  if [ -f "$d/go.mod" ]; then
    echo "==> $d"
    (cd "$d" && go test ./...)
  fi
done
'''

[tasks.vet]
description = "Run go vet for every Go module"
run = '''
set -e
for d in packages/*/ sdk/go/; do
  if [ -f "$d/go.mod" ]; then
    echo "==> $d"
    (cd "$d" && go vet ./...)
  fi
done
'''

[tasks.db-up]
description = "Start a local postgres:17 for tests on host port 5433"
run = '''
docker run -d --name connect-it-pg \
  -e POSTGRES_PASSWORD=postgres \
  -e POSTGRES_DB=connect_it \
  -p 5433:5432 \
  postgres:17
until docker exec connect-it-pg pg_isready -U postgres >/dev/null 2>&1; do sleep 0.5; done
echo "postgres ready on :5433"
'''

[tasks.db-down]
description = "Stop and remove the local test postgres"
run = "docker rm -f connect-it-pg"

[tasks.sqlc]
description = "Generate the sqlc store code"
run = "cd packages/service && sqlc generate"

[tasks.swagger]
description = "Generate packages/api/docs from swag annotations; swagger.json feeds the SDK"
run = "cd packages/api && go run github.com/swaggo/swag/cmd/swag@v1.16.6 init -g cmd/connect-it/main.go --output docs --parseDependency"

[tasks.build-web]
description = "Build the admin UI into packages/web/dist, served by nginx in the web container"
run = "pnpm --dir packages/web run build"

[tasks.sdk]
description = "Regenerate the TypeScript SDK from packages/api/docs/swagger.json"
run = "pnpm --dir packages/sdk run generate"

[tasks.docker-build]
description = "Build the server and web images (context = repo root)"
run = '''
set -e
docker build -f docker/server.Dockerfile -t connect-it-server:dev .
docker build -f docker/web.Dockerfile -t connect-it-web:dev .
'''

[tasks.docker-up]
description = "Build and start the docker compose stack, wait until healthy"
run = "docker compose up --build --wait"

[tasks.docker-down]
description = "Stop the docker compose stack (postgres volume is kept)"
run = "docker compose down"

[tasks.dev]
description = "Run the API locally; start the database first with mise run db-up"
run = '''
cd packages/api && \
DATABASE_URL='postgres://postgres:postgres@localhost:5433/connect_it?sslmode=disable' \
CONNECT_IT_SECRET_KEY='1:1111111111111111111111111111111111111111111111111111111111111111' \
COOKIE_SECRET='dev-cookie-secret' \
CONNECT_IT_ADMIN_PASSWORD='admin123' \
CONNECT_IT_BASE_URL='http://localhost:8080' \
go run ./cmd/connect-it
'''
