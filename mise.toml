[settings]
# 本机若有系统 Go，PATH 上的 go 与 mise 注入的 GOROOT 会错配（driver/toolchain
# version mismatch）。关闭注入让每个 go 二进制使用自身 GOROOT。
go_set_goroot = false

[tools]
go = "1.25"
node = "22"
pnpm = "10"
sqlc = "1.29.0"

[tasks.test]
description = "逐 Go module 运行测试"
run = '''
set -e
for d in packages/*/; do
  if [ -f "$d/go.mod" ]; then
    echo "==> $d"
    (cd "$d" && go test ./...)
  fi
done
'''

[tasks.vet]
description = "逐 Go module 运行 go vet"
run = '''
set -e
for d in packages/*/; do
  if [ -f "$d/go.mod" ]; then
    echo "==> $d"
    (cd "$d" && go vet ./...)
  fi
done
'''

[tasks.db-up]
description = "启动本地测试 postgres:17（host 端口 5433）"
run = '''
docker run -d --name connect-it-pg \
  -e POSTGRES_PASSWORD=postgres \
  -e POSTGRES_DB=connect_it \
  -p 5433:5432 \
  postgres:17
until docker exec connect-it-pg pg_isready -U postgres >/dev/null 2>&1; do sleep 0.5; done
echo "postgres ready on :5433"
'''

[tasks.db-down]
description = "停止并删除本地测试 postgres"
run = "docker rm -f connect-it-pg"

[tasks.sqlc]
description = "生成 sqlc store 代码"
run = "cd packages/service && sqlc generate"
