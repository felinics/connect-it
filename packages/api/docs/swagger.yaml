basePath: /
definitions:
  api.ErrorResponse:
    properties:
      error:
        type: string
      message:
        type: string
    type: object
  api.VersionResponse:
    properties:
      version:
        type: string
    type: object
  api.authMethodDTO:
    properties:
      credential_fields:
        items:
          $ref: '#/definitions/api.configFieldDTO'
        type: array
      key:
        type: string
      label:
        type: string
      type:
        type: string
    type: object
  api.beginOAuthRequest:
    properties:
      alias:
        type: string
      auth_method:
        type: string
      connector_type:
        type: string
    type: object
  api.beginOAuthResponse:
    properties:
      authorization_url:
        type: string
      connection_id:
        type: string
    type: object
  api.changePasswordRequest:
    properties:
      password:
        type: string
    type: object
  api.configFieldDTO:
    properties:
      default_value:
        type: string
      description:
        type: string
      input_type:
        type: string
      key:
        type: string
      label:
        type: string
      options:
        items:
          type: string
        type: array
      pattern:
        type: string
      required:
        type: boolean
      secret:
        type: boolean
    type: object
  api.configResponse:
    properties:
      connector_type:
        type: string
      public:
        additionalProperties: {}
        type: object
      schema_version:
        type: integer
      secret_keys_set:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  api.createAPIKeyRequest:
    properties:
      alias:
        type: string
      auth_method:
        type: string
      connector_type:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
    type: object
  api.createConnectionResponse:
    properties:
      connection_id:
        type: string
    type: object
  api.createMCPSessionRequest:
    properties:
      connections:
        additionalProperties:
          type: string
        type: object
      tool_allowlist:
        items:
          type: string
        type: array
      ttl_seconds:
        type: integer
    type: object
  api.createMCPSessionResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  api.createTokenRequest:
    properties:
      name:
        type: string
    type: object
  api.createTokenResponse:
    properties:
      id:
        type: string
      token:
        type: string
    type: object
  api.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  api.oauthRedirectURLResponse:
    properties:
      redirect_url:
        type: string
    type: object
  api.putConfigRequest:
    properties:
      if_match:
        type: string
      public:
        additionalProperties: {}
        type: object
      secrets:
        additionalProperties:
          type: string
        type: object
    type: object
  api.updateConnectorEnabledRequest:
    properties:
      enabled:
        type: boolean
    required:
    - enabled
    type: object
  authsvc.APITokenView:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      revoked_at:
        type: string
    type: object
  catalogsvc.AuthMethodSummary:
    properties:
      credential_fields:
        items:
          $ref: '#/definitions/catalogsvc.CredentialField'
        type: array
      key:
        type: string
      label:
        type: string
      type:
        $ref: '#/definitions/connector.AuthMethodType'
    type: object
  catalogsvc.CredentialField:
    properties:
      default_value:
        type: string
      description:
        type: string
      input_type:
        $ref: '#/definitions/connector.ConfigInputType'
      key:
        type: string
      label:
        type: string
      options:
        items:
          type: string
        type: array
      pattern:
        type: string
      required:
        type: boolean
      secret:
        type: boolean
    type: object
  catalogsvc.Item:
    properties:
      auth_methods:
        items:
          $ref: '#/definitions/catalogsvc.AuthMethodSummary'
        type: array
      categories:
        items:
          type: string
        type: array
      description:
        type: string
      enabled:
        type: boolean
      homepage_url:
        type: string
      icon_url:
        type: string
      mode:
        $ref: '#/definitions/connector.Mode'
      name:
        type: string
      status:
        $ref: '#/definitions/status.Status'
      type:
        type: string
    type: object
  connector.AuthMethodType:
    enum:
    - none
    - oauth2
    - api_key
    - custom_credential
    type: string
    x-enum-varnames:
    - AuthNone
    - AuthOAuth2
    - AuthAPIKey
    - AuthCustomCredential
  connector.ConfigInputType:
    enum:
    - text
    - select
    type: string
    x-enum-varnames:
    - InputText
    - InputSelect
  connector.Mode:
    enum:
    - remote_mcp
    - managed
    type: string
    x-enum-varnames:
    - ModeRemoteMCP
    - ModeManaged
  connsvc.ConnectionView:
    properties:
      alias:
        type: string
      auth_method:
        type: string
      connector_type:
        type: string
      created_at:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  status.Status:
    enum:
    - needs_config
    - config_incompatible
    - ready
    - deprecated
    - definition_missing
    - disabled
    type: string
    x-enum-varnames:
    - NeedsConfig
    - ConfigIncompatible
    - Ready
    - Deprecated
    - DefinitionMissing
    - Disabled
info:
  contact: {}
  description: 'Self-hosted connector gateway: catalog, config management, OAuth connections
    and aggregated MCP.'
  title: connect-it API
  version: "1.0"
paths:
  /admin/account/password:
    put:
      consumes:
      - application/json
      operationId: changePassword
      parameters:
      - description: New password, at least 8 characters
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.changePasswordRequest'
      responses:
        "204":
          description: No Content
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Change the administrator password
      tags:
      - admin
  /admin/api-tokens:
    get:
      operationId: listApiTokens
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/authsvc.APITokenView'
            type: array
      summary: List API tokens without plaintext
      tags:
      - admin
    post:
      consumes:
      - application/json
      operationId: createApiToken
      parameters:
      - description: Token name
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.createTokenResponse'
      summary: Create an API token; the plaintext appears in this response only
      tags:
      - admin
  /admin/api-tokens/{id}:
    delete:
      operationId: deleteApiToken
      parameters:
      - description: token id（uuid）
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Revoke an API token
      tags:
      - admin
  /admin/connections:
    get:
      operationId: listConnections
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/connsvc.ConnectionView'
            type: array
      summary: List every connection for operators, without credentials
      tags:
      - admin
  /admin/connections/{id}:
    delete:
      operationId: adminDeleteConnection
      parameters:
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Delete a connection, operator view
      tags:
      - admin
  /admin/connections/{id}/reauth:
    post:
      operationId: adminReauthConnection
      parameters:
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.beginOAuthResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Mint a re-authorization link for an operator to hand to the right end
        user
      tags:
      - admin
  /admin/connectors:
    get:
      operationId: adminListConnectors
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/catalogsvc.Item'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: List every connector for the admin UI, cookie authenticated
      tags:
      - admin
  /admin/connectors/{type}/auth-methods:
    get:
      operationId: listAuthMethods
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.authMethodDTO'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Auth methods and credential fields of a connector, for the create-connection
        form
      tags:
      - admin
  /admin/connectors/{type}/config:
    delete:
      operationId: deleteConfig
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Delete connector config
      tags:
      - admin
    get:
      operationId: getConfig
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.configResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Read connector config; secrets echo back only the keys that are set
      tags:
      - admin
    put:
      consumes:
      - application/json
      operationId: putConfig
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      - description: Config payload; pass the updated_at you last read as if_match
          (RFC3339), leave empty on first create
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.putConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.configResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Write connector config; public is replaced wholesale, secrets are merged
        and an empty string deletes
      tags:
      - admin
  /admin/connectors/{type}/config-schema:
    get:
      operationId: getConfigSchema
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.configFieldDTO'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Config form metadata for a connector, derived from the ConfigFields
        of its Definition
      tags:
      - admin
  /admin/connectors/{type}/enabled:
    put:
      consumes:
      - application/json
      operationId: updateConnectorEnabled
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      - description: Connector enabled state
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.updateConnectorEnabledRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalogsvc.Item'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Enable or disable a connector
      tags:
      - admin
  /admin/login:
    post:
      consumes:
      - application/json
      operationId: login
      parameters:
      - description: User name and password
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.loginRequest'
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Log in as administrator and receive a session cookie
      tags:
      - admin
  /admin/oauth/redirect-url:
    get:
      operationId: getOAuthRedirectURL
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.oauthRedirectURLResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Get the OAuth callback URL that operators must register with providers
      tags:
      - admin
  /healthz:
    get:
      operationId: healthz
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Health check
      tags:
      - system
  /v1/connections/{id}:
    delete:
      operationId: deleteConnection
      parameters:
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Delete a connection
      tags:
      - connections
    get:
      operationId: getConnection
      parameters:
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connsvc.ConnectionView'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get connection status (pending / active / reauth_required and so on)
      tags:
      - connections
  /v1/connections/{id}/reauth:
    post:
      operationId: reauthConnection
      parameters:
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.beginOAuthResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Re-authorize an existing connection, keeping the same ID
      tags:
      - connections
  /v1/connections/api-key:
    post:
      consumes:
      - application/json
      operationId: createApiKeyConnection
      parameters:
      - description: Fill credential fields per the CredentialFields of the auth method;
          alias is optional
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.createConnectionResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Create a connection from an API key or custom credential and return
        its durable ID
      tags:
      - connections
  /v1/connections/oauth:
    post:
      consumes:
      - application/json
      operationId: beginOAuthConnection
      parameters:
      - description: alias is an optional display label
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.beginOAuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.beginOAuthResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 'Start an OAuth authorization: create a pending connection and return
        its durable ID and authorization URL'
      tags:
      - connections
  /v1/connectors:
    get:
      operationId: listConnectors
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/catalogsvc.Item'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: List every connector with its runtime status
      tags:
      - catalog
  /v1/connectors/{type}:
    get:
      operationId: getConnector
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalogsvc.Item'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Get a single connector
      tags:
      - catalog
  /v1/mcp-sessions:
    post:
      consumes:
      - application/json
      operationId: createMcpSession
      parameters:
      - description: connections maps namespace to connection_id; allowlist entries
          use namespace__tool names
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createMCPSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.createMCPSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: Issue a short-lived MCP session token aggregating several connections
      tags:
      - mcp
  /v1/oauth/callback:
    get:
      operationId: oauthCallback
      parameters:
      - description: The state generated when the authorization started
        in: query
        name: state
        type: string
      - description: Authorization code
        in: query
        name: code
        type: string
      - description: Error code returned by the provider
        in: query
        name: error
        type: string
      responses:
        "200":
          description: OK
      summary: OAuth callback where the provider redirects back; unauthenticated and
        secured by a single-use state
      tags:
      - connections
  /version:
    get:
      operationId: getVersion
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.VersionResponse'
      summary: Get the running service version
      tags:
      - system
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
