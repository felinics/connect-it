basePath: /
definitions:
  api.ErrorResponse:
    properties:
      error:
        description: Error 是稳定、机器可读的错误码。
        type: string
      message:
        description: Message 可安全返回调用方，不含 Provider 原始响应或 credential 值。
        type: string
      retry_after_seconds:
        description: RetryAfterSeconds 仅在已知正数重试延迟时出现。
        type: integer
      temporary:
        description: Temporary 表示稍后重试是否可能成功。
        type: boolean
    type: object
  api.adminBeginOAuthRequest:
    properties:
      alias:
        type: string
      auth_method:
        type: string
      connector_type:
        type: string
    required:
    - auth_method
    - connector_type
    type: object
  api.authMethodDTO:
    properties:
      credential_fields:
        items:
          $ref: '#/definitions/api.configFieldDTO'
        type: array
      key:
        type: string
      label:
        type: string
      type:
        type: string
    type: object
  api.beginOAuthRequest:
    properties:
      alias:
        type: string
      auth_method:
        type: string
      connector_type:
        type: string
      redirect_url:
        type: string
    required:
    - auth_method
    - connector_type
    type: object
  api.beginOAuthResponse:
    properties:
      authorization_url:
        type: string
      connection_id:
        type: string
    type: object
  api.changePasswordRequest:
    properties:
      password:
        type: string
    type: object
  api.configFieldDTO:
    properties:
      default_value:
        type: string
      description:
        type: string
      input_type:
        type: string
      key:
        type: string
      label:
        type: string
      options:
        items:
          type: string
        type: array
      pattern:
        type: string
      required:
        type: boolean
      secret:
        type: boolean
    type: object
  api.configResponse:
    properties:
      connector_type:
        type: string
      public:
        additionalProperties: {}
        type: object
      schema_version:
        type: integer
      secret_keys_set:
        items:
          type: string
        type: array
      updated_at:
        type: string
    type: object
  api.createAPIKeyRequest:
    properties:
      alias:
        type: string
      auth_method:
        type: string
      connector_type:
        type: string
      fields:
        additionalProperties:
          type: string
        type: object
    required:
    - auth_method
    - connector_type
    - fields
    type: object
  api.createConnectionResponse:
    properties:
      connection_id:
        type: string
    type: object
  api.createMCPSessionRequest:
    properties:
      connections:
        additionalProperties:
          type: string
        description: Connections 将 Session-local alias 映射到持久 Connection UUID。
        type: object
      tool_allowlist:
        description: |-
          ToolAllowlist 区分三态：省略时固化当前 read Tool，[] 授权零 Tool，null
          非法；write/destructive Tool 必须显式列出。
        items:
          type: string
        type: array
      ttl_seconds:
        description: TTLSeconds 是 Session 有效期；0 使用默认 3600 秒，上限 86400 秒。
        maximum: 86400
        minimum: 0
        type: integer
    type: object
  api.createMCPSessionResponse:
    properties:
      expires_at:
        type: string
      token:
        type: string
    type: object
  api.createTokenRequest:
    properties:
      name:
        type: string
    type: object
  api.createTokenResponse:
    properties:
      id:
        type: string
      token:
        type: string
    type: object
  api.loginRequest:
    properties:
      password:
        type: string
      username:
        type: string
    type: object
  api.putConfigRequest:
    properties:
      if_match:
        type: string
      public:
        additionalProperties: {}
        type: object
      secrets:
        additionalProperties:
          type: string
        type: object
    type: object
  api.reauthRequest:
    properties:
      redirect_url:
        type: string
    type: object
  api.recredentialRequest:
    properties:
      fields:
        additionalProperties:
          type: string
        description: |-
          Fields 是完整 API-key/custom-credential 字段组；缺少 required 字段会被
          拒绝，本端点不是局部 PATCH。
        type: object
    required:
    - fields
    type: object
  api.validateConfigRequest:
    properties:
      public:
        additionalProperties: {}
        type: object
      secrets:
        additionalProperties:
          type: string
        type: object
    type: object
  authsvc.APITokenView:
    properties:
      created_at:
        type: string
      id:
        type: string
      name:
        type: string
      revoked_at:
        type: string
    type: object
  catalogsvc.Item:
    properties:
      categories:
        items:
          type: string
        type: array
      description:
        type: string
      homepage_url:
        type: string
      icon_url:
        type: string
      name:
        type: string
      status:
        $ref: '#/definitions/status.Status'
      type:
        type: string
    type: object
  connsvc.ConnectionView:
    properties:
      alias:
        type: string
      auth_method:
        type: string
      connector_type:
        type: string
      created_at:
        type: string
      id:
        type: string
      status:
        type: string
    type: object
  status.Status:
    enum:
    - catalog_only
    - needs_config
    - config_incompatible
    - ready
    - degraded
    - deprecated
    - definition_missing
    type: string
    x-enum-varnames:
    - CatalogOnly
    - NeedsConfig
    - ConfigIncompatible
    - Ready
    - Degraded
    - Deprecated
    - DefinitionMissing
info:
  contact: {}
  description: |-
    内部 Connector 服务：catalog、配置管理、OAuth 连接与聚合 MCP。
    管理端 /admin 使用 HttpOnly SameSite=Strict Cookie；CONNECT_IT_BASE_URL 为 HTTPS 时固定设置 Secure。浏览器客户端须启用 credentials=include，且写请求须携带 X-Connect-It-CSRF: 1。Swagger 2 无法形式化表达 Cookie 鉴权。
  title: connect-it API
  version: "1.0"
paths:
  /admin/account/password:
    put:
      consumes:
      - application/json
      operationId: changePassword
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: 新密码（至少 8 个字符）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.changePasswordRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 修改管理员密码
      tags:
      - admin
  /admin/api-tokens:
    get:
      operationId: listApiTokens
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/authsvc.APITokenView'
            type: array
      summary: 列出 API token（不含明文）
      tags:
      - admin
    post:
      consumes:
      - application/json
      operationId: createApiToken
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: token 名称
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createTokenRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.createTokenResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 创建 API token（明文仅在响应中出现一次）
      tags:
      - admin
  /admin/api-tokens/{id}:
    delete:
      operationId: deleteApiToken
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: token id（uuid）
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 撤销 API token
      tags:
      - admin
  /admin/connections:
    get:
      operationId: listConnections
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/connsvc.ConnectionView'
            type: array
      summary: 列出全部连接（运维视角，不含 credential）
      tags:
      - admin
  /admin/connections/{id}:
    delete:
      operationId: adminDeleteConnection
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 删除连接（运维）
      tags:
      - admin
  /admin/connections/{id}/credential:
    put:
      consumes:
      - application/json
      operationId: adminRecredentialConnection
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      - description: 完整 credential 字段组；不是局部 PATCH
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.recredentialRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connsvc.ConnectionView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 从管理台验证并整组替换 API key / 自定义凭证
      tags:
      - admin
  /admin/connections/{id}/reauth:
    post:
      consumes:
      - application/json
      operationId: adminReauthConnection
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.beginOAuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 生成重授权链接（运维转交给对应用户打开）
      tags:
      - admin
  /admin/connections/api-key:
    post:
      consumes:
      - application/json
      operationId: adminCreateApiKeyConnection
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: 完整凭证字段组按 auth method 的 CredentialFields 填写；alias 可选
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.createConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 从管理台用 API key / 自定义凭证创建连接
      tags:
      - admin
  /admin/connections/oauth:
    post:
      consumes:
      - application/json
      operationId: adminBeginOAuthConnection
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: alias 为可选展示标签；管理台授权固定回到 connect-it 完成页
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.adminBeginOAuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.beginOAuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 从管理台发起 OAuth 授权，返回持久连接 ID 与授权 URL
      tags:
      - admin
  /admin/connectors:
    get:
      operationId: adminListConnectors
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/catalogsvc.Item'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 列出全部 Connector（管理界面，cookie 鉴权）
      tags:
      - admin
  /admin/connectors/{type}/auth-methods:
    get:
      operationId: listAuthMethods
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.authMethodDTO'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Connector 的认证方式与凭证字段（供创建 connection 的表单）
      tags:
      - admin
  /admin/connectors/{type}/config:
    delete:
      operationId: deleteConfig
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 删除 Connector 配置
      tags:
      - admin
    get:
      operationId: getConfig
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.configResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 读取 Connector 配置（Secret 只回显已设置的 key）
      tags:
      - admin
    put:
      consumes:
      - application/json
      operationId: putConfig
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      - description: 配置内容；if_match 传上次读到的 updated_at（RFC3339），首次创建留空
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.putConfigRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.configResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 写入 Connector 配置（public 全量替换、secrets 增量合并，空串删除）
      tags:
      - admin
  /admin/connectors/{type}/config-schema:
    get:
      operationId: getConfigSchema
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/api.configFieldDTO'
            type: array
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: Connector 配置表单元数据（由 Definition 的 ConfigFields 生成）
      tags:
      - admin
  /admin/connectors/{type}/config:validate:
    post:
      consumes:
      - application/json
      operationId: validateConfig
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      - description: 待校验配置
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.validateConfigRequest'
      responses:
        "204":
          description: No Content
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 仅校验配置不落库
      tags:
      - admin
  /admin/connectors/{type}/mcp:verify:
    post:
      operationId: verifyMcp
      parameters:
      - description: 管理台同源写请求固定值 1
        in: header
        name: X-Connect-It-CSRF
        required: true
        type: string
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 实测 Connector 的全部 Remote MCP server 并比对 tool 映射
      tags:
      - admin
  /admin/login:
    post:
      consumes:
      - application/json
      operationId: login
      parameters:
      - description: 用户名与密码
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.loginRequest'
      responses:
        "204":
          description: No Content
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      summary: 管理员登录，成功后下发会话 cookie
      tags:
      - admin
  /healthz:
    get:
      operationId: healthz
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            additionalProperties:
              type: string
            type: object
      summary: 健康检查
      tags:
      - system
  /v1/connections/{id}:
    delete:
      operationId: deleteConnection
      parameters:
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      responses:
        "204":
          description: No Content
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 删除连接
      tags:
      - connections
    get:
      operationId: getConnection
      parameters:
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connsvc.ConnectionView'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询连接状态（pending / active / reauth_required …）
      tags:
      - connections
  /v1/connections/{id}/credential:
    put:
      consumes:
      - application/json
      operationId: recredentialConnection
      parameters:
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      - description: 完整 credential 字段组；不是局部 PATCH
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.recredentialRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/connsvc.ConnectionView'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 验证并整组替换 API key / 自定义凭证；并发旧请求按版本冲突拒绝
      tags:
      - connections
  /v1/connections/{id}/reauth:
    post:
      consumes:
      - application/json
      operationId: reauthConnection
      parameters:
      - description: connection id（uuid）
        in: path
        name: id
        required: true
        type: string
      - description: redirect_url 可选
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.reauthRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.beginOAuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "409":
          description: Conflict
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 对既有连接重新发起授权（ID 不变）
      tags:
      - connections
  /v1/connections/api-key:
    post:
      consumes:
      - application/json
      operationId: createApiKeyConnection
      parameters:
      - description: 凭证字段按 auth method 的 CredentialFields 填写；alias 可选
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createAPIKeyRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.createConnectionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "403":
          description: Forbidden
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "408":
          description: Request Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "429":
          description: Too Many Requests
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "502":
          description: Bad Gateway
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "503":
          description: Service Unavailable
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "504":
          description: Gateway Timeout
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 用 API key / 自定义凭证创建连接，返回其持久 ID
      tags:
      - connections
  /v1/connections/oauth:
    post:
      consumes:
      - application/json
      operationId: beginOAuthConnection
      parameters:
      - description: alias 为可选展示标签；redirect_url 为授权完成后回跳调用方的地址（可选）
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.beginOAuthRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.beginOAuthResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
        "422":
          description: Unprocessable Entity
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 发起 OAuth 授权：立即创建 pending 连接并返回其持久 ID 与授权 URL
      tags:
      - connections
  /v1/connectors:
    get:
      operationId: listConnectors
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/catalogsvc.Item'
            type: array
        "401":
          description: Unauthorized
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 列出全部 Connector（含运行状态）
      tags:
      - catalog
  /v1/connectors/{type}:
    get:
      operationId: getConnector
      parameters:
      - description: connector_type
        in: path
        name: type
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/catalogsvc.Item'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 查询单个 Connector
      tags:
      - catalog
  /v1/mcp-sessions:
    post:
      consumes:
      - application/json
      operationId: createMcpSession
      parameters:
      - description: 连接绑定与不可变 grant 快照；省略 allowlist 默认当前 read，[] 为零 Tool，null 拒绝；write/destructive
          必须显式列出；ttl_seconds 默认 3600、上限 86400
        in: body
        name: body
        required: true
        schema:
          $ref: '#/definitions/api.createMCPSessionRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/api.createMCPSessionResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.ErrorResponse'
      security:
      - BearerAuth: []
      summary: 签发短期 MCP session token（固化 alias、Tool grant 与授权代际）
      tags:
      - mcp
  /v1/oauth/callback:
    get:
      operationId: oauthCallback
      parameters:
      - description: 授权发起时生成的 state
        in: query
        name: state
        type: string
      - description: 授权码
        in: query
        name: code
        type: string
      - description: provider 返回的错误码
        in: query
        name: error
        type: string
      responses:
        "302":
          description: Found
      summary: OAuth 回调（provider 跳转回来，无鉴权，靠一次性 state）
      tags:
      - connections
securityDefinitions:
  BearerAuth:
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
